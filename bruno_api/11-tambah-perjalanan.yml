      value: application/json
  body:
    type: json
    data: |-
      {
        "institusi": "Tempat Belajar",
        "kategori": "pelatihan",
        "tanggal_mulai": "2025-01-01",
        "tanggal_selesai": "",
        "informasi_tambahan": "Kelas Go",
        "deskripsi": "Latihan backend",
        "sort_order": 3
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) bru.setVar("perjalananId", res.getBody().id_perjalanan);
